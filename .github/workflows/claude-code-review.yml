name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Dependabot-triggered runs can't read Actions secrets (no OAuth token), and
    # lockfile bumps don't need an AI review.
    if: github.event.pull_request.user.login != 'dependabot[bot]'

    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Passing `prompt` runs the action in automation (agent) mode: no
          # "Claude Code is working..." progress comment and no download of
          # images from PR comments. Do not add `track_progress: true` - it
          # brings back the progress comment and its spinner GIF.
          #
          # `use_sticky_comment` only applies to that progress comment, so the
          # single updating review comment is done with `gh pr comment
          # --edit-last --create-if-none` instead.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Be constructive and helpful in your feedback.

            The PR branch is already checked out in the current working directory.
            Use `gh pr view` and `gh pr diff` to see the PR description and changes,
            and read the repository's CLAUDE.md for project conventions.

            Post your review as a single PR comment with:
            gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "<your review>"
            This updates your previous review on later pushes instead of adding a new
            comment each time. Do not post any other comments.

          # Sonnet 4.5 is deprecated and retires 2026-11-30; claude-sonnet-5-5 is
          # the documented replacement. Pin explicitly so a retired default can't
          # 404 the review on every PR again.
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
